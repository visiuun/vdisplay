[package]
name = "vdisplay"
version = "1.0.0"
edition = "2024"
authors = ["visiuun"]
description = "Controller for the MARS GAMING MC-3TCORELCD (DS916) 360x960 case screen"
repository = "https://github.com/visiuun/vdisplay"
license-file = "LICENSE"
readme = "README.md"
keywords = ["lcd", "case-screen", "mars-gaming", "smtc", "hardware-monitor"]
publish = false

[dependencies]
ab_glyph = "0.2.32"
chrono = "0.4.45"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
jpeg-encoder = { version = "0.7.1", features = ["simd"] }
nvml-wrapper = "0.13.0"
parking_lot = "0.13.0"
raw-window-handle = "0.6.2"
regex = "1.13.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serialport = "4.10.1"
sysinfo = "0.39.6"
tiny-skia = "0.12.0"
tray-icon = "0.26.1"
ureq = "3.5.0"
urlencoding = "2.1.3"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_Com",
    "Win32_Media",
    "Win32_Devices_Communication",
    "Win32_Security",
    "Media_Control",
    "Storage_Streams",
    "Foundation",
] }
windows-future = "0.3.2"
winreg = "0.56.0"
wmi = "0.18.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Keep the renderer fast even in debug builds.
[profile.dev.package."*"]
opt-level = 3

[build-dependencies]
winresource = "0.1.34"
